<!-- ==========================================================================
  RUM Integration — Elastic APM RUM Agent
  
  Inject this snippet into the <head> of the frontend Go templates.
  The Online Boutique frontend uses Go html/template with layout files
  typically at: src/frontend/templates/

  Integration steps:
    1. Locate the base layout template (e.g., header.html or layout.html)
    2. Add this block inside <head> before the closing </head> tag
    3. Rebuild the frontend Docker image

  The APM Server URL must be accessible from the browser. If running
  locally, port-forward the APM Server:
    kubectl port-forward svc/apm-server-apm-http 8200:8200 -n elastic

  For production, expose APM Server via Ingress with CORS headers.
========================================================================== -->

<script src="https://unpkg.com/@elastic/apm-rum@5.16.0/dist/bundles/elastic-apm-rum.umd.min.js" crossorigin></script>
<script>
  (function() {
    // ── APM Server endpoint (browser-accessible) ──
    // Update this to match your exposed APM Server URL
    var APM_SERVER_URL = 'http://localhost:8200';

    var apm = window.elasticApm.init({
      serviceName: 'frontend-rum',
      serverUrl: APM_SERVER_URL,
      serviceVersion: '1.0.0',
      environment: 'assessment',

      // Enable distributed tracing headers on outbound requests
      distributedTracingOrigins: [
        'http://boutique.local',
        'http://localhost:8080',
        window.location.origin
      ],

      // Use current page path as the transaction name
      pageLoadTransactionName: window.location.pathname,

      // Propagate W3C traceparent headers
      propagateTracestate: true,
    });

    // ── Custom context (Section 2.1 requirement 5) ──
    // Session ID
    var sessionId = 'sess-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    apm.setUserContext({
      id: sessionId,
    });

    // Page route + device classification
    apm.addLabels({
      'page.route': window.location.pathname,
      'session.id': sessionId,
      'device.type': /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
      'user_agent.classification': /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
    });

    // ── User interaction tracing (Section 2.1 requirement 2) ──
    // Track clicks on key UI elements
    document.addEventListener('DOMContentLoaded', function() {
      // "Add to Cart" button tracking
      var addToCartBtns = document.querySelectorAll('[data-action="add-to-cart"], .btn-add-to-cart, form[action="/cart"] button[type="submit"]');
      addToCartBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var transaction = apm.startTransaction('click-add-to-cart', 'user-interaction');
          if (transaction) {
            transaction.addLabels({ 'ui.element': 'add-to-cart' });
            setTimeout(function() { transaction.end(); }, 3000);
          }
        });
      });

      // "Checkout" button tracking
      var checkoutBtns = document.querySelectorAll('[data-action="checkout"], .btn-checkout, form[action="/cart/checkout"] button[type="submit"]');
      checkoutBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var transaction = apm.startTransaction('click-checkout', 'user-interaction');
          if (transaction) {
            transaction.addLabels({ 'ui.element': 'checkout' });
            setTimeout(function() { transaction.end(); }, 5000);
          }
        });
      });
    });

    console.log('[RUM] Elastic APM RUM Agent initialized — service: frontend-rum');
  })();
</script>
