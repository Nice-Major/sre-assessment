# =============================================================================
# OpenTelemetry Collector — DaemonSet Agent (per-node)
# Receives telemetry from application SDKs, enriches with k8s metadata,
# and forwards to the Gateway collector.
# =============================================================================
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.97.0"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Expose agent on hostPort so pods can reach it via node IP
ports:
  otlp:
    enabled: true
    containerPort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    hostPort: 4318
    protocol: TCP
  zipkin:
    enabled: true
    containerPort: 9411
    hostPort: 9411
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false

presets:
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
  kubeletMetrics:
    enabled: false

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411
    hostmetrics:
      collection_interval: 30s
      scrapers:
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
        memory:
          metrics:
            system.memory.utilization:
              enabled: true
        disk: {}
        filesystem: {}
        network: {}
        load: {}
        processes: {}

  processors:
    memory_limiter:
      check_interval: 5s
      limit_mib: 400
      spike_limit_mib: 100
    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048
    resourcedetection:
      detectors: [env, system, docker]
      timeout: 5s
      override: false
    k8sattributes:
      auth_type: "serviceAccount"
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.node.name
          - k8s.container.name
        labels:
          - tag_name: app
            key: app
            from: pod
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: connection
    resource:
      attributes:
        - key: deployment.environment
          value: assessment
          action: upsert

  exporters:
    otlp/gateway:
      endpoint: "otel-gateway-opentelemetry-collector.otel-system.svc.cluster.local:4317"
      tls:
        insecure: true
      retry_on_failure:
        enabled: true
        initial_interval: 5s
        max_interval: 30s
        max_elapsed_time: 300s
    debug:
      verbosity: basic

  extensions:
    zpages:
      endpoint: 0.0.0.0:55679
    health_check:
      endpoint: 0.0.0.0:13133

  service:
    extensions: [zpages, health_check]
    telemetry:
      logs:
        level: info
      metrics:
        address: 0.0.0.0:8889
    pipelines:
      traces:
        receivers: [otlp, zipkin]
        processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
        exporters: [otlp/gateway]
      metrics:
        receivers: [otlp, hostmetrics]
        processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
        exporters: [otlp/gateway]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
        exporters: [otlp/gateway]
