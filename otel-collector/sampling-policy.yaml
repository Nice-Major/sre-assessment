# =============================================================================
# Tail-Based Sampling Policy — Rationale Document
# =============================================================================
#
# WHY TAIL-BASED SAMPLING?
# Head-based sampling (at SDK level) decides before the trace completes,
# risking loss of error traces and slow requests. Tail-based sampling
# at the gateway sees the full trace before deciding.
#
# POLICIES (applied in order; first match wins):
#
# 1. always-sample-errors
#    - Type: status_code
#    - Keep: 100% of traces containing ERROR spans
#    - Rationale: Every error is valuable for debugging; errors are rare
#      enough that storage impact is negligible.
#
# 2. sample-high-latency
#    - Type: latency
#    - Threshold: > 1000ms
#    - Keep: 100% of slow traces
#    - Rationale: Latency outliers signal performance regressions.
#      The 1s threshold is set above the p95 for most Online Boutique
#      services, so this captures only genuinely slow requests.
#
# 3. probabilistic-baseline
#    - Type: probabilistic
#    - Rate: 10%
#    - Keep: 10% of remaining healthy traces
#    - Rationale: Provides statistical visibility into normal traffic
#      patterns while reducing storage by ~85-90%. For the assessment
#      traffic volume, 10% still yields enough samples for meaningful
#      dashboards and service map visibility.
#
# STORAGE IMPACT ESTIMATE:
#   Without sampling: ~100% of traces stored
#   With this policy: ~15-20% stored (all errors + all slow + 10% healthy)
#   Expected savings: 80-85% reduction in trace storage
#
# TUNING NOTES:
#   - decision_wait: 10s allows time for all spans in a trace to arrive
#     before the sampling decision. Increase if services have high latency.
#   - num_traces: 100,000 traces held in memory during the decision window.
#     For the assessment workload this is more than sufficient.
#   - If storage is not a concern (e.g., short-lived assessment),
#     increase probabilistic_percentage to 50-100%.
