# =============================================================================
# INSTRUMENTATION PATCH: Currency Service (Node.js)
# =============================================================================
# Currency service converts product prices to the user's local currency.
# Called by: frontend, checkoutservice
# Language: Node.js — uses @opentelemetry/auto-instrumentations-node
# Applied via: kubectl patch deployment currencyservice -n online-boutique --patch-file
# =============================================================================
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-gateway-opentelemetry-collector.otel-system.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "currencyservice"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=1.0.0,deployment.environment=assessment"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: "otel-gateway-opentelemetry-collector.otel-system.svc.cluster.local:4317"
