# =============================================================================
# INSTRUMENTATION PATCH: Frontend (Go)
# =============================================================================
# Applied via: kubectl patch deployment frontend -n online-boutique --patch-file
# Adds OTel environment variables so the built-in SDK sends telemetry to the OTel Agent.
# =============================================================================
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-agent-opentelemetry-collector.otel-system.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "frontend"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=1.0.0,deployment.environment=assessment"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
