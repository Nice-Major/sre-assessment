# =============================================================================
# INSTRUMENTATION PATCH: Cart Service (C# / .NET)
# =============================================================================
# PURPOSE:
#   Adds OTel environment variables to the cartservice Deployment.
#   Same approach as the frontend patch — no code or image changes needed.
#
#   Cart Service is interesting for observability because:
#   - It uses Redis as a backend (Redis operations appear as trace spans)
#   - It handles gRPC calls from frontend and checkout services
#   - Cart operations (add/remove/empty) are key business metrics
#
# TRACES YOU'LL SEE IN KIBANA:
#   When a user adds an item to their cart:
#   frontend → cartservice → Redis
#   Each hop is a span in the trace, with timing information.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  namespace: online-boutique
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-agent-opentelemetry-collector.otel-system.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "cartservice"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=1.0.0,deployment.environment=assessment"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
