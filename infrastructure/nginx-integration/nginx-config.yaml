# =============================================================================
# Elastic Agent — NGINX Ingress Controller Integration Config
# Section 3.4 — Load Balancer Monitoring
#
# Collects both metrics (Prometheus endpoint) and structured access logs.
# =============================================================================

inputs:
  # NGINX metrics via Prometheus endpoint scraping
  - type: nginx/metrics
    id: nginx-metrics
    data_stream.namespace: assessment
    use_output: default
    streams:
      - metricset: stubstatus
        data_stream.dataset: nginx.stubstatus
        period: 10s
        hosts:
          - "http://ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254"
        server_status_path: "/nginx_status"

  # NGINX access logs (structured JSON format)
  - type: logfile
    id: nginx-access-logs
    data_stream.namespace: assessment
    use_output: default
    streams:
      - data_stream.dataset: nginx.access
        paths:
          - "/var/log/nginx/access.log"
          # If collecting from the ingress controller pod logs:
          - "/var/log/containers/ingress-nginx-controller*.log"
        processors:
          - decode_json_fields:
              fields: ["message"]
              target: "nginx"
              overwrite_keys: true
          - add_fields:
              target: ""
              fields:
                service.name: nginx-ingress

  # NGINX error logs
  - type: logfile
    id: nginx-error-logs
    data_stream.namespace: assessment
    use_output: default
    streams:
      - data_stream.dataset: nginx.error
        paths:
          - "/var/log/nginx/error.log"

# --- Alternative: OTel Collector Prometheus Receiver ---
