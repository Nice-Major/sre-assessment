# --- Key Metrics to Visualize (Section 3.4 Requirements) ---
# ✓ Request rate per ingress/host/path
# ✓ Response status code distribution (2xx/3xx/4xx/5xx) per backend
# ✓ Request latency histograms (p50/p90/p99) per upstream
# ✓ Active connections and connection rate
# ✓ SSL/TLS handshake errors and certificate expiry
# ✓ Upstream response time vs total request time (LB overhead)
# ✓ Request/response body size distributions

# --- Alerting Rules (created in Kibana) ---
# Alert 1: 5xx error rate spike — >5% of requests over 2 minutes
# Alert 2: Upstream service unavailable — backend returning 502/503
# Alert 3: SSL certificate expiring within 14 days
