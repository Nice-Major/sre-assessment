# =============================================================================
# Elastic Agent Fleet Policy — System Integration (VM / Compute Monitoring)
# Section 3.1
#
# This policy is applied via Fleet in Kibana:
#   Kibana → Fleet → Agent policies → Create policy
#
# Alternatively, deploy standalone Elastic Agent with this config.
# =============================================================================
# Fleet Policy: sre-assessment-system
#
# Integrations included:
#   - System (system metrics + system logs)
#
# Metrics collected:
#   - CPU utilization (per-core and aggregate)
#   - Memory usage (used/available/cached/buffered)
#   - Disk I/O (read/write IOPS, throughput, latency, utilization)
#   - Network I/O (bytes in/out, packets, errors, drops)
#   - Filesystem usage (% used, inodes)
#   - System load averages (1m, 5m, 15m)
#   - Process counts and states
# =============================================================================

# Standalone Elastic Agent configuration (if not using Fleet)
outputs:
  default:
    type: elasticsearch
    hosts:
      - "http://elasticsearch-es-http.elastic.svc.cluster.local:9200"
    username: "elastic"
    password: "${ES_PASSWORD}"

inputs:
  - type: system/metrics
    id: system-metrics
    data_stream.namespace: assessment
    use_output: default
    streams:
      - metricset: cpu
        data_stream.dataset: system.cpu
        period: 10s
        cpu.metrics: [percentages, normalized_percentages, ticks]
        core.metrics: [percentages]
      - metricset: memory
        data_stream.dataset: system.memory
        period: 10s
      - metricset: diskio
        data_stream.dataset: system.diskio
        period: 10s
      - metricset: filesystem
        data_stream.dataset: system.filesystem
        period: 60s
      - metricset: network
        data_stream.dataset: system.network
        period: 10s
      - metricset: load
        data_stream.dataset: system.load
        period: 10s
      - metricset: process
        data_stream.dataset: system.process
        period: 30s
        processes: ['.*']
        include_top_n.by_cpu: 10
        include_top_n.by_memory: 10

  - type: logfile
    id: system-syslog
    data_stream.namespace: assessment
    use_output: default
    streams:
      - data_stream.dataset: system.syslog
        paths:
          - /var/log/syslog
          - /var/log/messages
      - data_stream.dataset: system.auth
        paths:
          - /var/log/auth.log
          - /var/log/secure
