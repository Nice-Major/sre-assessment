# =============================================================================
# Calico Flow Logs + Filebeat Shipping to Elasticsearch
# Section 3.3 — Firewall & Network Policy Monitoring
#
# This configures Calico to emit flow logs and Filebeat to ship them.
# =============================================================================

# Step 1: Enable Calico flow logs via FelixConfiguration
# Run: kubectl apply -f calico-flow-logs.yaml
apiVersion: projectcalico.org/v3
kind: FelixConfiguration
metadata:
  name: default
spec:
  # Enable flow logging (Calico Enterprise OR Calico OSS with eBPF)
  flowLogsFlushInterval: "15s"
  flowLogsFileEnabled: true
  flowLogsFileDirectory: "/var/log/calico/flowlogs"
  flowLogsFileAggregationKindForAllowed: 1
  flowLogsFileAggregationKindForDenied: 0
  flowLogsEnableNetworkSets: true
  # Ensure policy audit logging
  policySyncPathPrefix: "/var/run/nodeagent"

---
# Step 2: Filebeat DaemonSet to ship Calico flow logs to Elasticsearch
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat-calico
  namespace: elastic
  labels:
    app: filebeat-calico
spec:
  selector:
    matchLabels:
      app: filebeat-calico
  template:
    metadata:
      labels:
        app: filebeat-calico
    spec:
      serviceAccountName: filebeat-calico
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.13.4
          args: ["-c", "/etc/filebeat/filebeat.yml", "-e"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: calico-logs
              mountPath: /var/log/calico
              readOnly: true
          env:
            - name: ELASTICSEARCH_HOST
              value: "http://elasticsearch-es-http.elastic.svc.cluster.local:9200"
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
      volumes:
        - name: config
          configMap:
            name: filebeat-calico-config
        - name: calico-logs
          hostPath:
            path: /var/log/calico
            type: DirectoryOrCreate

---
# Filebeat configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-calico-config
  namespace: elastic
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: log
        enabled: true
        paths:
          - /var/log/calico/flowlogs/*.log
        json.keys_under_root: true
        json.overwrite_keys: true
        json.add_error_key: true
        fields:
          log.type: calico-flowlog
        fields_under_root: true
        processors:
          - add_fields:
              target: ""
              fields:
                event.kind: event
                event.category: network
                event.type: connection
          - rename:
              fields:
                - from: "source_name"
                  to: "source.pod.name"
                - from: "dest_name"
                  to: "destination.pod.name"
                - from: "source_namespace"
                  to: "source.namespace"
                - from: "dest_namespace"
                  to: "destination.namespace"
                - from: "action"
                  to: "event.action"
              ignore_missing: true

    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOST}"]
      username: "${ELASTICSEARCH_USERNAME}"
      password: "${ELASTICSEARCH_PASSWORD}"
      index: "logs-calico.flowlog-assessment"

    setup.ilm.enabled: true
    setup.ilm.rollover_alias: "logs-calico.flowlog-assessment"
    setup.ilm.pattern: "{now/d}-000001"

---
# Filebeat service account + RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat-calico
  namespace: elastic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat-calico
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat-calico
subjects:
  - kind: ServiceAccount
    name: filebeat-calico
    namespace: elastic
roleRef:
  kind: ClusterRole
  name: filebeat-calico
  apiGroup: rbac.authorization.k8s.io
