# =============================================================================
# Kubernetes Network Policies — Section 3.3
# Firewall & Network Policy Monitoring
#
# These policies enforce least-privilege network access between services
# in the online-boutique namespace. Calico CNI provides flow log visibility.
# =============================================================================

# 1. Default deny all ingress in online-boutique namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: online-boutique
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# 2. Allow frontend to receive traffic from NGINX Ingress Controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: online-boutique
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---
# 3. Allow frontend to call backend services (productcatalog, cart, currency,
#    shipping, checkout, recommendation, ad)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backends
  namespace: online-boutique
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - productcatalogservice
          - cartservice
          - currencyservice
          - shippingservice
          - checkoutservice
          - recommendationservice
          - adservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 7070
        - protocol: TCP
          port: 7000
        - protocol: TCP
          port: 3550
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 5050
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9555

---
# 4. Allow checkoutservice to call payment, shipping, cart, currency, email
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-checkout-to-backends
  namespace: online-boutique
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - paymentservice
          - shippingservice
          - cartservice
          - currencyservice
          - emailservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: checkoutservice
      ports:
        - protocol: TCP
          port: 7070
        - protocol: TCP
          port: 7000
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 8080

---
# 5. Allow cartservice to access Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cart-to-redis
  namespace: online-boutique
spec:
  podSelector:
    matchLabels:
      app: redis-cart
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cartservice
      ports:
        - protocol: TCP
          port: 6379

---
# 6. Allow recommendation service to call productcatalog
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-recommendation-to-catalog
  namespace: online-boutique
spec:
  podSelector:
    matchLabels:
      app: productcatalogservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: recommendationservice
      ports:
        - protocol: TCP
          port: 3550

---
# 7. Allow all pods to reach the OTel Agent (telemetry egress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-egress
  namespace: online-boutique
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to any pod in same namespace (inter-service gRPC)
    - to:
        - podSelector: {}

---
# 8. Default deny egress for online-boutique (except what's allowed above)
# NOTE: Applied AFTER the allow-otel-egress to not break telemetry
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-external-egress
  namespace: online-boutique
  annotations:
    description: "Block unexpected egress to external IPs; internal and OTel traffic is allowed"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Same namespace
    - to:
        - podSelector: {}
    # OTel system
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
    # Elastic namespace (for Elastic Agent direct shipping if needed)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
