# =============================================================================
# Kubernetes Audit Log Shipping — Policy Change Events
# Section 3.3 — Captures NetworkPolicy creation/modification/deletion
# =============================================================================

# Filebeat with Kubernetes audit log module
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat-kube-audit
  namespace: elastic
  labels:
    app: filebeat-kube-audit
spec:
  selector:
    matchLabels:
      app: filebeat-kube-audit
  template:
    metadata:
      labels:
        app: filebeat-kube-audit
    spec:
      serviceAccountName: filebeat-calico
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.13.4
          args: ["-c", "/etc/filebeat/filebeat.yml", "-e"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: audit-logs
              mountPath: /var/log/kubernetes/audit
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: filebeat-kube-audit-config
        - name: audit-logs
          hostPath:
            path: /var/log/kubernetes/audit
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-kube-audit-config
  namespace: elastic
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: log
        enabled: true
        paths:
          - /var/log/kubernetes/audit/*.log
        json.keys_under_root: true
        json.overwrite_keys: true
        processors:
          - include_fields:
              fields: ["verb", "objectRef", "user", "responseStatus", "requestReceivedTimestamp"]
          - drop_event:
              when:
                not:
                  or:
                    - contains:
                        objectRef.resource: "networkpolicies"
                    - contains:
                        objectRef.resource: "globalnetworkpolicies"

    output.elasticsearch:
      hosts: ["http://elasticsearch-es-http.elastic.svc.cluster.local:9200"]
      username: "elastic"
      password: "${ELASTICSEARCH_PASSWORD}"
      index: "logs-kube.audit-assessment"

    setup.ilm.enabled: true
