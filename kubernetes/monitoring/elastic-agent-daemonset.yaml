# =============================================================================
# METRICBEAT — Standalone DaemonSet for Infrastructure Monitoring
# =============================================================================
# PURPOSE:
#   Deploys Metricbeat on every AKS node to collect infrastructure metrics.
#   Uses docker.elastic.co/beats/metricbeat:8.13.4 which runs standalone
#   (no Fleet Server enrollment required — reads config from ConfigMap).
#
#   Replaces the previous Elastic Agent DaemonSet, which crashed because the
#   elastic-agent image requires Fleet enrollment and its entrypoint script
#   cannot find the binary when run in standalone mode.
#
#   Metrics collected:
#     Section 3.1 — Compute:  system.* (cpu, memory, disk, network, load)
#     Section 3.2 — Database: postgresql.*, redis.*
#     Section 3.4 — Load Balancer: nginx metrics via Prometheus scrape
#       (metrics-prometheus.* indices; ingress-nginx exposes at :10254/metrics)
#
# DATA FLOW:
#   K8s Node → Metricbeat (this DaemonSet) → Elasticsearch (system.*)
#   PostgreSQL → Metricbeat → Elasticsearch (metrics-postgresql.*)
#   Redis      → Metricbeat → Elasticsearch (metrics-redis.*)
#   NGINX :10254/metrics → Metricbeat prometheus module → Elasticsearch
# =============================================================================

# ---- RBAC: ServiceAccount + ClusterRole for Metricbeat ----
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: monitoring
  labels:
    app: elastic-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: elastic-agent
  apiGroup: rbac.authorization.k8s.io

---
# ---- ConfigMap: Metricbeat configuration ----
# Standard Metricbeat YAML format with one module block per integration.
# The prometheus module scrapes ingress-nginx Prometheus endpoint instead of
# nginx stub_status (which requires additional ingress-nginx configuration
# to expose the status server outside the pod's loopback interface).
apiVersion: v1
kind: ConfigMap
metadata:
  name: elastic-agent-config
  namespace: monitoring
data:
  metricbeat.yml: |
    metricbeat.modules:

      # ---- SYSTEM METRICS (Section 3.1 — Compute Monitoring) ----
      - module: system
        metricsets:
          - cpu
          - load
          - memory
          - network
          - process
          - diskio
          - filesystem
        period: 10s
        processes: ['.*']
        cpu.metrics: ["percentages", "normalized_percentages"]
        filesystem.ignore_types:
          - tmpfs
          - devtmpfs
          - devfs
          - iso9660
          - overlay
          - aufs
          - squashfs
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"

      # ---- POSTGRESQL METRICS (Section 3.2 — Database Monitoring) ----
      - module: postgresql
        enabled: true
        metricsets:
          - activity
          - database
          - bgwriter
        period: 30s
        hosts:
          - "postgres://boutique:assessment-pg-pass@postgresql.online-boutique.svc.cluster.local:5432/boutique_db?sslmode=disable"

      # ---- REDIS METRICS (Section 3.2 — Database Monitoring) ----
      - module: redis
        metricsets:
          - info
          - keyspace
        period: 30s
        hosts:
          - "redis://redis-cart.online-boutique.svc.cluster.local:6379"

      # ---- NGINX METRICS via Prometheus scrape (Section 3.4 — Load Balancer) ----
      # ingress-nginx exposes full Prometheus metrics at :10254/metrics, including:
      #   nginx_ingress_controller_requests (by status code, method, path)
      #   nginx_ingress_controller_response_duration_seconds (latency histogram)
      #   nginx_ingress_controller_bytes_sent_total (bandwidth)
      # This is richer than stub_status and avoids needing a separate status server.
      - module: prometheus
        metricsets: [collector]
        period: 30s
        hosts:
          - "http://ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254"
        metrics_path: /metrics

    processors:
      - add_cloud_metadata: {}
      - add_host_metadata: {}

    output.elasticsearch:
      hosts:
        - "https://elasticsearch-es-http.elastic.svc.cluster.local:9200"
      username: "elastic"
      password: "${ELASTIC_PASSWORD}"
      ssl.verification_mode: none

    # Kibana setup — allows loading sample dashboards; optional for monitoring
    # setup.kibana:
    #   host: "http://kibana-kb-http.elastic.svc.cluster.local:5601"

    # Ship monitoring telemetry about Metricbeat itself to Elasticsearch
    monitoring.enabled: false

    logging.level: info
    logging.to_files: false

---
# ---- DaemonSet: Run one Metricbeat per node ----
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elastic-agent
  namespace: monitoring
  labels:
    app: elastic-agent
spec:
  selector:
    matchLabels:
      app: elastic-agent
  template:
    metadata:
      labels:
        app: elastic-agent
    spec:
      serviceAccountName: elastic-agent
      tolerations:
        # Run on all nodes including control plane
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      hostNetwork: false
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: elastic-agent
          image: docker.elastic.co/beats/metricbeat:8.13.4
          args:
            - "-c"
            - "/etc/metricbeat/metricbeat.yml"
            - "-e"
            - "--strict.perms=false"
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - SYS_PTRACE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/metricbeat/metricbeat.yml
              subPath: metricbeat.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/metricbeat/data
            - name: proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: sys
              mountPath: /hostfs/sys
              readOnly: true
            - name: cgroup
              mountPath: /hostfs/sys/fs/cgroup
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: elastic-agent-config
            defaultMode: 0600
        - name: data
          hostPath:
            path: /var/lib/metricbeat-data
            type: DirectoryOrCreate
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
