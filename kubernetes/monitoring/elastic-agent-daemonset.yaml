# =============================================================================
# ELASTIC AGENT — Standalone DaemonSet for Infrastructure Monitoring
# =============================================================================
# PURPOSE:
#   This deploys an Elastic Agent on EVERY node in the AKS cluster.
#   It collects infrastructure metrics for all 4 monitoring categories:
#
#   Section 3.1 — Compute:
#     - CPU utilization per core (system.cpu)
#     - Memory used/available (system.memory)
#     - Disk I/O and filesystem usage (system.diskio, system.filesystem)
#     - Network bytes/errors per interface (system.network)
#     - Load averages (system.load)
#
#   Section 3.2 — Databases:
#     - PostgreSQL: connection pool, cache hits, transactions (postgresql.*)
#     - Redis: memory usage, eviction rate, connected clients (redis.info)
#
#   Section 3.4 — Load Balancer:
#     - NGINX stub_status: active connections, accepted, handled, requests
#
# WHY THIS FILE EXISTS:
#   elastic-agent-config.yaml creates a ConfigMap (the config content) but
#   does NOT run any agent. This DaemonSet mounts that ConfigMap and runs
#   the actual Elastic Agent binary in "standalone" mode (no Fleet Server
#   enrollment needed — it reads config directly from the mounted file).
#
# DATA FLOW:
#   K8s Node → Elastic Agent (this DaemonSet) → Elasticsearch
#   PostgreSQL → Elastic Agent (one pod polls all DB instances) → Elasticsearch
#   Redis → Elastic Agent → Elasticsearch
#   NGINX metrics endpoint → Elastic Agent → Elasticsearch
#
# STANDALONE vs FLEET MODE:
#   Fleet mode: Agent enrolls in Fleet Server, gets config pushed to it.
#   Standalone mode: Agent reads config from a local file (our ConfigMap).
#   Standalone is simpler and doesn't require Fleet Server to be running.
# =============================================================================

# ---- RBAC: ServiceAccount + ClusterRole for Elastic Agent ----
# Elastic Agent needs K8s API access to:
# - Read pod/namespace/node metadata for enrichment
# - Collect Kubernetes-level metrics (optional, not configured here)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: monitoring
  labels:
    app: elastic-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
subjects:
  - kind: ServiceAccount
    name: elastic-agent
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: elastic-agent
  apiGroup: rbac.authorization.k8s.io

---
# ---- ConfigMap: Elastic Agent configuration (standalone mode) ----
# This ConfigMap defines ALL inputs in a single elastic-agent.yml file.
# Each section corresponds to a monitoring integration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: elastic-agent-config
  namespace: monitoring
data:
  elastic-agent.yml: |
    agent:
      monitoring:
        enabled: true
        logs: true
        metrics: true

    inputs:
      # ---- SYSTEM METRICS (Section 3.1 — Compute Monitoring) ----
      - id: system-metrics
        type: system/metrics
        data_stream:
          namespace: assessment
        use_output: default
        streams:
          - data_stream:
              dataset: system.cpu
              type: metrics
            metricsets: ["cpu"]
            period: 10s
            cpu.metrics: ["percentages", "normalized_percentages"]
          - data_stream:
              dataset: system.memory
              type: metrics
            metricsets: ["memory"]
            period: 10s
          - data_stream:
              dataset: system.diskio
              type: metrics
            metricsets: ["diskio"]
            period: 30s
          - data_stream:
              dataset: system.filesystem
              type: metrics
            metricsets: ["filesystem"]
            period: 60s
            processors:
              - drop_event.when.regexp:
                  system.filesystem.mount_point: '^/(sys|cgroup|proc|dev|etc|host|lib|snap)($|/)'
          - data_stream:
              dataset: system.network
              type: metrics
            metricsets: ["network"]
            period: 10s
          - data_stream:
              dataset: system.load
              type: metrics
            metricsets: ["load"]
            period: 10s

      # ---- POSTGRESQL METRICS (Section 3.2 — Database Monitoring) ----
      # Only runs on one node (all agents will try; non-reachable ones skip gracefully)
      - id: postgresql-metrics
        type: postgresql/metrics
        data_stream:
          namespace: assessment
        use_output: default
        streams:
          - data_stream:
              dataset: postgresql.activity
              type: metrics
            metricsets: ["activity"]
            period: 10s
            hosts:
              - "postgres://boutique:assessment-pg-pass@postgresql.online-boutique.svc.cluster.local:5432/boutique_db?sslmode=disable"
          - data_stream:
              dataset: postgresql.database
              type: metrics
            metricsets: ["database"]
            period: 30s
            hosts:
              - "postgres://boutique:assessment-pg-pass@postgresql.online-boutique.svc.cluster.local:5432/boutique_db?sslmode=disable"
          - data_stream:
              dataset: postgresql.bgwriter
              type: metrics
            metricsets: ["bgwriter"]
            period: 60s
            hosts:
              - "postgres://boutique:assessment-pg-pass@postgresql.online-boutique.svc.cluster.local:5432/boutique_db?sslmode=disable"

      # ---- REDIS METRICS (Section 3.2 — Database Monitoring) ----
      - id: redis-metrics
        type: redis/metrics
        data_stream:
          namespace: assessment
        use_output: default
        streams:
          - data_stream:
              dataset: redis.info
              type: metrics
            metricsets: ["info"]
            period: 10s
            hosts:
              - "redis://redis-cart.online-boutique.svc.cluster.local:6379"
          - data_stream:
              dataset: redis.keyspace
              type: metrics
            metricsets: ["keyspace"]
            period: 60s
            hosts:
              - "redis://redis-cart.online-boutique.svc.cluster.local:6379"

      # ---- NGINX METRICS (Section 3.4 — Load Balancer Monitoring) ----
      - id: nginx-metrics
        type: nginx/metrics
        data_stream:
          namespace: assessment
        use_output: default
        streams:
          - data_stream:
              dataset: nginx.stubstatus
              type: metrics
            metricsets: ["stubstatus"]
            period: 10s
            hosts:
              - "http://ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254/nginx_status"

    outputs:
      default:
        type: elasticsearch
        hosts:
          - "https://elasticsearch-es-http.elastic.svc.cluster.local:9200"
        username: "elastic"
        password: "${ELASTIC_PASSWORD}"
        ssl.verification_mode: none

---
# ---- DaemonSet: Run one Elastic Agent per node ----
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elastic-agent
  namespace: monitoring
  labels:
    app: elastic-agent
spec:
  selector:
    matchLabels:
      app: elastic-agent
  template:
    metadata:
      labels:
        app: elastic-agent
    spec:
      serviceAccountName: elastic-agent
      tolerations:
        # Run on all nodes including control plane (for completeness)
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: elastic-agent
          image: docker.elastic.co/beats/elastic-agent:8.13.4
          args:
            - "-c"
            - "/etc/elastic-agent/elastic-agent.yml"
            - "-e"
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
            # Tell the agent its node name for metadata enrichment
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/elastic-agent/elastic-agent.yml
              subPath: elastic-agent.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/elastic-agent/data
            # Mount proc for host-level system metrics collection
            - name: proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: sys
              mountPath: /hostfs/sys
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: elastic-agent-config
        - name: data
          hostPath:
            path: /var/lib/elastic-agent-data
            type: DirectoryOrCreate
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
