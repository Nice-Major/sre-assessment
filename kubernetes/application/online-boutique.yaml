# =============================================================================
# ONLINE BOUTIQUE — Application Manifests (Vendored from Google)
# =============================================================================
# PURPOSE:
#   This file contains ALL the Kubernetes resources needed to run the
#   Google Online Boutique e-commerce application. It's a COPY of the
#   official manifests from:
#     https://github.com/GoogleCloudPlatform/microservices-demo
#
#   We "vendor" (copy) these manifests into our repo instead of applying
#   them from Google's URL because:
#   1. We control exactly which version is deployed
#   2. We can review changes before deploying
#   3. Our deployment doesn't depend on Google's servers
#   4. Git history shows exactly what changed and when
#
# THE APPLICATION:
#   Online Boutique is a sample e-commerce app with 11 microservices:
#
#   ┌─────────────────────────────────────────────────────────┐
#   │                    FRONTEND (Go)                         │
#   │              Web UI — serves HTML pages                  │
#   └──┬────────┬─────────┬──────────┬───────────┬───────────┘
#      │        │         │          │           │
#   ┌──▼──┐ ┌──▼──────┐ ┌▼────────┐ ┌▼────────┐ ┌▼──────┐
#   │cart │ │checkout │ │product  │ │currency │ │ad    │
#   │svc  │ │svc     │ │catalog  │ │svc      │ │svc   │
#   │(C#) │ │(Go)    │ │(Go)     │ │(Node.js)│ │(Java)│
#   └──┬──┘ └┬──┬──┬─┘ └─────────┘ └─────────┘ └──────┘
#      │     │  │  │
#   ┌──▼──┐ ┌▼──▼──▼────────────────────┐
#   │Redis│ │payment, shipping, email   │
#   │     │ │(Node.js, Go, Python)      │
#   └─────┘ └───────────────────────────┘
#
#   + loadgenerator (Python/Locust) — generates synthetic traffic
#
# DOCKER IMAGES:
#   All images are pre-built by Google and hosted in Google Artifact Registry.
#   We use them AS-IS — no custom image builds needed.
#   The images already include OTel SDK auto-instrumentation libraries.
#   We just need to set environment variables (in k8s-patch.yaml files)
#   to tell the SDKs WHERE to send telemetry data.
#
# HOW IT CONNECTS TO OTEL:
#   After deploying these manifests, the instrumentation patches
#   (instrumentation/*/k8s-patch.yaml) add OTEL_EXPORTER_OTLP_ENDPOINT
#   env vars pointing to the OTel Agent. The flow becomes:
#     App Pod → OTel Agent (port 4317) → OTel Gateway → APM Server → Elasticsearch
# =============================================================================

# ---- FRONTEND (Go) ----
# The main web UI. Serves HTML pages and makes gRPC calls to backend services.
# Accessible externally via NGINX Ingress on port 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: online-boutique
  labels:
    app: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend:v0.10.5
          ports:
            - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
                - name: "Cookie"
                  value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
                - name: "Cookie"
                  value: "shop_session-id=x-liveness-probe"
          env:
            - name: PORT
              value: "8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalogservice:3550"
            - name: CURRENCY_SERVICE_ADDR
              value: "currencyservice:7000"
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: RECOMMENDATION_SERVICE_ADDR
              value: "recommendationservice:8080"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
            - name: CHECKOUT_SERVICE_ADDR
              value: "checkoutservice:5050"
            - name: AD_SERVICE_ADDR
              value: "adservice:9555"
            - name: ENABLE_PROFILER
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: online-boutique
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: online-boutique

