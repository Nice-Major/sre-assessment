# =============================================================================
# INGRESS: Frontend (Online Boutique Web UI)
# =============================================================================
# PURPOSE:
#   Makes the Online Boutique web application accessible from the internet.
#   Users visit http://<INGRESS_IP>.nip.io and see the e-commerce store.
#
# HOW IT WORKS:
#   1. User's browser sends HTTP request to the public IP
#   2. Azure Load Balancer forwards to NGINX Ingress Controller pod
#   3. NGINX matches the host header and routes to the frontend service
#   4. frontend service routes to the frontend pod (Go web server on port 8080)
#
# NOTE: INGRESS_IP_PLACEHOLDER is replaced with the actual IP at deploy time
#   by the GitHub Actions workflow using `sed`.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: online-boutique
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Inject Elastic APM RUM Agent into every HTML page served by the frontend.
    # This enables Real User Monitoring (browser-side telemetry) without
    # rebuilding Docker images. NGINX replaces </head> with the RUM script + </head>.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      sub_filter '</head>' '<script src="https://unpkg.com/@elastic/apm-rum@5.16.0/dist/bundles/elastic-apm-rum.umd.min.js" crossorigin></script><script>elasticApm.init({serviceName:"frontend-rum",serverUrl:"http://apm.INGRESS_IP_PLACEHOLDER.nip.io",serviceVersion:"1.0.0",environment:"assessment",distributedTracingOrigins:["http://INGRESS_IP_PLACEHOLDER.nip.io"],pageLoadTransactionName:window.location.pathname,propagateTracestate:true});var sid="sess-"+Date.now()+"-"+Math.random().toString(36).substr(2,9);elasticApm.setUserContext({id:sid});elasticApm.addLabels({"page.route":window.location.pathname,"session.id":sid,"device.type":/Mobi|Android/i.test(navigator.userAgent)?"mobile":"desktop"});</script></head>';
      sub_filter_once on;
      sub_filter_types text/html;
spec:
  ingressClassName: nginx
  rules:
    - host: "INGRESS_IP_PLACEHOLDER.nip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
