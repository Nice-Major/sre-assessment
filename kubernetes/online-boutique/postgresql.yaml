# PostgreSQL deployment for Section 3.2 — Database Monitoring
# The Online Boutique does NOT include PostgreSQL; we deploy one explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: online-boutique
type: Opaque
stringData:
  POSTGRES_USER: "boutique"
  POSTGRES_PASSWORD: "assessment-pg-pass"
  POSTGRES_DB: "boutique_db"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: online-boutique
  labels:
    app: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: postgresql-credentials
          args:
            # Enable pg_stat_statements for slow query monitoring
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=all"
            - "-c"
            - "log_min_duration_statement=200"
            - "-c"
            - "log_statement=ddl"
            - "-c"
            - "max_connections=100"
          resources:
            requests:
              memory: 256Mi
              cpu: "250m"
            limits:
              memory: 512Mi
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: online-boutique
  labels:
    app: postgresql
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: postgresql
  clusterIP: None
