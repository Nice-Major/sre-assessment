apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-server
  namespace: elastic
spec:
  version: 8.13.4
  count: 1
  elasticsearchRef:
    name: elasticsearch
  kibanaRef:
    name: kibana
  config:
    # OTLP intake — required for OpenTelemetry Collector export
    apm-server:
      auth:
        secret_token: "assessment-secret-token"
      # RUM support (Section 2)
      rum:
        enabled: true
        allow_origins: ["*"]
        allow_headers: ["Content-Type", "traceparent", "tracestate"]
        library_pattern: "node_modules|bower_components|~"
      # OTLP receiver for OTel Collector
      # APM Server natively accepts OTLP on :8200
    output:
      elasticsearch:
        hosts: ["http://elasticsearch-es-http.elastic.svc.cluster.local:9200"]
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      containers:
        - name: apm-server
          resources:
            requests:
              memory: 512Mi
              cpu: "500m"
            limits:
              memory: 1Gi
